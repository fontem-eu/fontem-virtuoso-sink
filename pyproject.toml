[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmr-virtuoso-sink"
version = "0.1.0"
description = "Virtuoso projection sink for the gmr_app event log."
requires-python = ">=3.11"
dependencies = [
    "gmr-events",
    "gmr-event-schemas",
    "httpx>=0.28",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
virtuoso-sink = "virtuoso_sink.__main__:main"

[tool.setuptools.packages.find]
include = ["virtuoso_sink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

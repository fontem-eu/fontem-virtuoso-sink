[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontem-virtuoso-sink"
version = "0.1.6"
description = "Virtuoso projection sink for the fontem event log."
requires-python = ">=3.11"
# fontem-events and fontem-event-schemas are pinned to the exact
# version of the wheel we vendor under `vendor/*.whl`. Bumping the
# pin without dropping a matching wheel into vendor/ (or vice-versa)
# fails the Docker build — see `vendor/CHECK_VERSIONS.md`.
dependencies = [
    "fontem-events==0.2.0",
    "fontem-event-schemas==0.1.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.1.19",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
virtuoso-sink = "virtuoso_sink.__main__:main"

[tool.setuptools.packages.find]
include = ["virtuoso_sink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pylint config — disable stylistic rules that don't fit an internal
# RDF projection sink:
#   missing-{module,class,function}-docstring — typed signatures
#     + descriptive symbol names already document the surface.
#   too-few-public-methods — frozen Triple dataclass + the per-event
#     renderers legitimately have no methods.
#   duplicate-code — the per-event-type `render_upsert_*` helpers
#     share a near-identical "build IRI → emit triples" shape by
#     design; that's the whole pattern, not noise.
[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
]
